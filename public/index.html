<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Günlük ajanda · Makas</title>
<style>
:root{color-scheme:light;--paper:#faf9f5;--surface:#fffefa;--ink:#232c27;--muted:#526058;--line:#d9ded6;--green:#254735;--red:#813b2f;--serif:Georgia,'Times New Roman',serif;font:100%/1.5 'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper)}[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.58}
button,input,select{min-height:44px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:8px 14px}
button:hover:enabled{border-color:#718578}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #568261;outline-offset:2px}
.primary{background:var(--green);border-color:var(--green);color:white;font-weight:650}.danger{background:var(--red);border-color:var(--red);color:white}
.wrap{width:min(1080px,calc(100% - 48px));margin-inline:auto}
header{background:var(--surface);border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:74px}.brand{font:600 27px var(--serif);letter-spacing:-.05em}.brand i{color:#945340}.submark{border-left:1px solid var(--line);padding-left:14px;margin-left:14px;color:var(--muted);font:500 14px system-ui}.lab-picker{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.lab-picker select{max-width:50vw;color:var(--ink)}
main{padding:40px 0 70px}h1,h2,h3,p{margin:0}h1{font:500 clamp(32px,4.4vw,54px)/1.15 var(--serif);letter-spacing:-.045em}.heading,.agenda-heading{display:flex;justify-content:space-between;align-items:center;gap:16px}.kicker,.muted{color:var(--muted)}.kicker{margin-bottom:5px;font-size:14px}
.agenda{margin-top:28px;border-top:2px solid var(--green);background:var(--surface);border-bottom:1px solid var(--line)}.agenda-heading{padding:22px 0 14px;flex-wrap:wrap}.agenda-heading h2{font:500 clamp(22px,3vw,31px)/1.24 var(--serif);letter-spacing:-.025em}.controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.controls button,.controls input{padding:6px 11px;font-size:14px}.date-arrow{min-width:44px}
.summary{padding:0 0 14px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
#list{list-style:none;margin:0;padding:0}.booking{display:grid;grid-template-columns:88px minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.booking:last-child{border:0}.time{font-variant-numeric:tabular-nums;font-size:18px;font-weight:650}.time small{display:block;color:var(--muted);font-weight:400;font-size:14px}.booking h3{font:600 17px/1.35 system-ui;overflow-wrap:anywhere}.booking p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.status{font-size:14px;color:var(--muted)}.status.arrived,.status.completed{color:var(--green)}.status.cancelled,.status.no_show{color:var(--red)}.edit-status{font-size:14px}
.empty{padding:30px 0;color:var(--muted)}details{margin-top:16px;border-bottom:1px solid var(--line)}summary{font-weight:600;cursor:pointer;padding:12px 0;min-height:44px}details ul{padding-left:20px}details li{margin-block:6px}.error{color:var(--red);margin:8px 0;font-weight:550}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;width:min(440px,calc(100% - 24px));max-height:90dvh;padding:24px;box-shadow:0 15px 70px #10201a29}dialog::backdrop{background:#15221db3}dialog h2{font:500 29px/1.25 var(--serif);margin-bottom:6px}dialog p{overflow-wrap:anywhere}.form{display:grid;gap:12px;margin-top:18px}.form label{font-weight:600;font-size:14px;display:grid;gap:5px}.form select,.form input{min-width:0;width:100%;font-weight:400;font-size:16px}.buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:620px){.wrap{width:calc(100% - 32px)}.bar{padding:10px 0;align-items:flex-start}.submark{display:block;border:0;padding:0;margin:1px 0 0;font-size:12px}.lab-picker{display:grid;gap:0;font-size:12px}.lab-picker select{max-width:55vw;padding:4px 8px}main{padding-top:22px}.heading{gap:4px;align-items:flex-end}.heading .primary{font-size:14px;padding:8px 10px}.agenda{margin-top:20px}.agenda-heading{gap:10px}.controls{width:100%}.controls input{min-width:0;max-width:100%;flex:1}.booking{grid-template-columns:55px minmax(0,1fr) auto;gap:4px 8px}.booking .status{grid-column:2}.edit-status{grid-column:3;grid-row:1/3;padding:6px}.time{grid-row:1/3}.summary{font-size:13px}}
</style>
<script src="/app.js" defer></script>
</head>
<body>
<header><div class="bar wrap"><div><span class="brand">Makas<i>.</i></span><span class="submark">İşletme paneli</span></div><label class="lab-picker">Laboratuvar salonu<select id="salon" disabled><option>Yükleniyor…</option></select></label></div></header>
<main class="wrap">
<section class="heading"><div><p id="shop-name" class="kicker">İşletme paneli</p><h1>Günlük ajanda</h1></div><button id="add" class="primary" hidden>Yeni randevu</button></section>
<p id="announcement" class="sr-only" role="status"></p>
<div id="content"><p class="empty" role="status">Ajanda yükleniyor…</p></div>
</main>
<dialog id="editor" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p class="muted" id="context"></p>
<form id="editor-form" class="form"><div class="form" id="fields"></div><p id="feedback" role="alert" class="error" hidden></p><div class="buttons"><button type="button" id="dismiss">Vazgeç</button><button type="submit" id="submit" class="primary">Kaydet</button></div></form></dialog>
</body></html>
