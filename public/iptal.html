<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f9f7f0">
  <title>Randevu iptali · Makas</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/cancel.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="frame masthead-inner">
      <a class="logo" href="/" aria-label="Makas, ana sayfa"><img src="/mark.svg" alt="" width="35" height="40"><span>Makas<span class="logo-dot">.</span></span></a>
    </div>
  </header>
  <main class="booking frame">
    <header class="booking-header">
      <h1 id="cancel-heading" class="cancel-heading" tabindex="-1">Randevu iptali</h1>
    </header>
    <section class="confirmation" aria-labelledby="cancel-heading">
      <noscript><p>İptal işlemi için tarayıcında JavaScript’i etkinleştir.</p></noscript>
      <p id="cancel-status" role="status" aria-live="polite"></p>
      <dl id="cancel-details" hidden></dl>
      <p id="cancel-error" role="alert" hidden></p>
      <div class="actions cancel-actions">
        <a class="secondary" href="/#randevu">Randevu sayfasına dön</a>
        <button class="primary" id="cancel-confirm" type="button" hidden>Randevuyu iptal et</button>
        <button class="primary" id="cancel-retry" type="button" hidden>Tekrar dene</button>
      </div>
    </section>
  </main>
</body>
</html>
