<svg xmlns="http://www.w3.org/2000/svg" width="810" height="1134" viewBox="0 0 810 1134" lang="tr" role="img" aria-labelledby="title desc">
  <title id="title">Makas SaaS yönetim planı</title>
  <desc id="desc">Platform yöneticisi salonları açar. Her dükkân sahibi yalnızca kendi salonunu yönetir. Müşteri salonun bağlantısında kendi randevusunu alır ve iptal eder. Laboratuvar işletme panelini örnek salonlarla canlandırır.</desc>
  <defs>
    <style>
      text{font-family:"DejaVu Sans",sans-serif;fill:#1d3731}
      .kicker{font-size:16px;font-weight:bold;letter-spacing:1.1px}
      .head{font-family:Georgia,"DejaVu Serif",serif;font-size:48px}
      .name{font-family:Georgia,"DejaVu Serif",serif;font-size:34px}
      .body{font-size:21px}
      .link{font-size:17px;font-weight:bold}
      .dark-white{fill:#faf8ef}
      .small{font-size:17px}
      .note{fill:#57665f}
      .icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <symbol id="platform" viewBox="0 0 32 32"><g class="icon"><rect x="12" y="3" width="8" height="7" rx="1"/><path d="M16 10v6M6 21v-5h20v5"/><rect x="2.5" y="21" width="7" height="7" rx="1"/><rect x="22.5" y="21" width="7" height="7" rx="1"/></g></symbol>
    <symbol id="shop" viewBox="0 0 32 32"><g class="icon"><path d="M3 12l3-7h20l3 7"/><path d="M3 12v1a3.25 3.25 0 006.5 0 3.25 3.25 0 006.5 0 3.25 3.25 0 006.5 0 3.25 3.25 0 006.5 0v-1z"/><path d="M6 18v9h20v-9M13 27v-7h6v7"/></g></symbol>
    <symbol id="customer" viewBox="0 0 32 32"><g class="icon"><rect x="7" y="2" width="18" height="28" rx="3"/><path d="M13 6h6M14 26h4m-8-11 4 4 7-8"/></g></symbol>
  </defs>
  <rect width="810" height="1134" fill="#f8f6ef"/>
  <g transform="translate(49 48)">
    <path d="M0 0h41" stroke="#9a5141" stroke-width="4"/>
    <text class="kicker" x="54" y="6">MAKAS  /  SaaS</text>
    <text class="head" y="77">Yönetim planı</text>
    <text class="body note" y="119">Tek platformda üç panel ve her salon için ayrı bir ajanda.</text>
  </g>
  <rect x="48" y="202" width="714" height="192" rx="11" fill="#1e4036"/>
  <use href="#platform" x="74" y="237" width="37" height="37" style="color:#d4e9dd"/>
  <text x="131" y="242" class="kicker" style="fill:#c4dccd">PLATFORM YÖNETİCİSİ · SEN</text>
  <text x="129" y="288" class="name dark-white">Yönetim paneli</text>
  <text x="131" y="332" class="body dark-white">Salon açar, işletme sahibine yetki verirsin.</text>
  <text x="131" y="366" class="body dark-white">Abonelikleri ve toplam kullanımı izlersin.</text>
  <path d="M95 394v63m-7-8 7 8 7-8" fill="none" stroke="#6e8377" stroke-width="2.5"/>
  <text x="130" y="434" class="link">Her işletme hesabı kendi salonuna bağlanır.</text>
  <rect x="48" y="463" width="714" height="198" rx="11" fill="#e2eae0" stroke="#bbccbe"/>
  <use href="#shop" x="74" y="501" width="38" height="38" style="color:#2f5846"/>
  <text x="131" y="504" class="kicker" style="fill:#435e4d">DÜKKÂN SAHİBİ</text>
  <text x="129" y="550" class="name">İşletme paneli</text>
  <text x="131" y="597" class="body">Kendi ekibini, hizmetlerini ve saatlerini belirler.</text>
  <text x="131" y="631" class="body">Günün ajandasını ve randevu durumlarını yönetir.</text>
  <path d="M85 661v64m-7-8 7 8 7-8M104 725v-64m-7 8 7-8 7 8" fill="none" stroke="#6e8377" stroke-width="2.2"/>
  <text x="130" y="700" class="link">Boş saatler müşteriye, randevu salona ulaşır.</text>
  <rect x="48" y="731" width="714" height="194" rx="11" fill="#fffdf8" stroke="#c7cdc3"/>
  <use href="#customer" x="74" y="768" width="38" height="38" style="color:#754d3c"/>
  <text x="131" y="772" class="kicker" style="fill:#80513f">MÜŞTERİ</text>
  <text x="129" y="818" class="name">Randevu uygulaması</text>
  <text x="131" y="864" class="body">Salonun bağlantısından hizmet, usta ve saat seçer.</text>
  <text x="131" y="897" class="body">Kendi randevusunu görür ve iptal edebilir.</text>
  <path d="M48 966h714" stroke="#c0c8bc"/>
  <text x="49" y="1004" class="kicker" style="fill:#435e4d">LABORATUVARIN KAPSAMI</text>
  <text x="49" y="1046" class="body">Bugünkü demo, işletme panelini örnek salonlarla canlandırır.</text>
  <text x="49" y="1080" class="small note">Üç panelin tamamı ve erişim sınırları ürünün hedef yönetim modelidir.</text>
</svg>
